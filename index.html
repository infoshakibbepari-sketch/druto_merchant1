<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DRUTO Merchant App</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'"><noscript><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"></noscript>
<style>
:root{--bg:#F3F4FA;--card:#fff;--ink:#1D2250;--mut:#6B7094;--line:#E4E6F2;--pri:#2B3590;--pri-t:#fff;--acc:#F5B700;--ok:#1E9E6A;--bad:#D64550;--wait:#B87400;--chip:#E9EBF8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1230;--card:#181C45;--ink:#EEF0FF;--mut:#9A9FCB;--line:#262B5E;--pri:#F5B700;--pri-t:#1D2250;--chip:#232855;--ok:#4FD4A0;--bad:#FF7B84;--wait:#FFC24D}}
:root[data-theme="dark"]{--bg:#0F1230;--card:#181C45;--ink:#EEF0FF;--mut:#9A9FCB;--line:#262B5E;--pri:#F5B700;--pri-t:#1D2250;--chip:#232855;--ok:#4FD4A0;--bad:#FF7B84;--wait:#FFC24D}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;font-size:14.5px;line-height:1.45}
#app{max-width:430px;height:100%;margin:0 auto;display:flex;flex-direction:column;position:relative;background:var(--bg)}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px}
.lg{width:48px;height:34px;flex:none}
.bn2{display:flex;flex-direction:column;line-height:1}
.bn2 b{font-size:22px;font-style:italic;font-weight:800;letter-spacing:.5px}
.bn2 small{font-size:7.4px;font-weight:800;color:#F7931E;letter-spacing:.5px;margin-top:3px}
.logo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;box-shadow:0 4px 12px rgba(43,53,144,.35)}
.logo svg{width:100%;height:100%;display:block;border-radius:12px}
.bell{position:relative;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.bell svg{width:21px;height:21px}
.bell i{position:absolute;top:-2px;right:-2px;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font:700 11px/18px Manrope;text-align:center;font-style:normal}
main{flex:1;overflow-y:auto;padding:16px 16px 24px}
h1{font-size:21px;font-weight:800;margin-bottom:12px}
h2{font-size:15.5px;font-weight:700;margin:18px 0 10px;display:flex;justify-content:space-between;align-items:baseline}
h2 a{font-size:13px;color:var(--pri);font-weight:600;cursor:pointer}
.mut{color:var(--mut);font-size:13px}
.btn{border:0;border-radius:14px;padding:11px 16px;font:inherit;font-weight:700;cursor:pointer;background:var(--acc);color:#1D2250}
.btn.line{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.pri{background:var(--pri);color:var(--pri-t)}
.btn.full{width:100%;padding:14px}
:is(.btn,.tab,.chip,.ord,input,select,.bell,.cc,.q button,.lk):focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px}
.live{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ok);font-weight:700}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok);animation:pl 1.6s infinite}
@keyframes pl{50%{opacity:.25}}
.big{font-size:28px;font-weight:800;letter-spacing:-.5px}
.up{color:var(--ok);font-weight:700;font-size:13px}.dn{color:var(--bad);font-weight:700;font-size:13px}
.rng{display:flex;gap:6px}
.chip{border:0;background:var(--chip);color:var(--ink);padding:6px 13px;border-radius:20px;font:inherit;font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--pri);color:var(--pri-t)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin:10px 0 4px}
svg.ch{width:100%;height:auto;display:block;margin-top:8px;touch-action:manipulation}
.ln.s{animation:none;stroke-dashoffset:0}
.ln{fill:none;stroke:var(--pri);stroke-width:3;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:1200;stroke-dashoffset:1200;animation:dw 1.1s ease forwards}
@keyframes dw{to{stroke-dashoffset:0}}
@media(prefers-reduced-motion:reduce){.ln{animation:none;stroke-dashoffset:0}.live::before{animation:none}}
.q{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0}
.q button{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:11px 2px;font:inherit;font-size:11.5px;font-weight:600;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px}
.q svg{width:23px;height:23px}
.q .pt{background:var(--acc);color:#1D2250;border-color:var(--acc)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{padding:12px}.stat b{font-size:21px;display:block}.stat span{font-size:12px;color:var(--mut)}
.slider{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 10px;margin:0 -16px;padding-inline:16px;scroll-padding-inline:16px}
.cc{flex:0 0 72%;scroll-snap-align:start;text-align:left;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;cursor:pointer}
.av{width:42px;height:42px;border-radius:50%;background:var(--acc);color:#1D2250;display:grid;place-items:center;font-weight:800;flex:none}
.cc .r{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.cc b{display:block}
.ord{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px;margin-bottom:10px;display:flex;gap:12px;align-items:center;font:inherit;color:inherit;cursor:pointer}
.ord .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--chip)}
.ord .m{flex:1;min-width:0}.ord .m b,.ord .rr b{display:block}.ord .m span{font-size:12.5px;color:var(--mut)}.ord .rr{text-align:right}
.tag{font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:20px;display:inline-block}
.t-ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.t-bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.t-wait{background:color-mix(in srgb,var(--wait) 20%,transparent);color:var(--wait)}
.t-way{background:var(--chip);color:var(--pri)}
label{display:block;font-size:12.5px;color:var(--mut);margin:12px 0 5px;font-weight:600}
input,select{width:100%;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.srch{display:flex;gap:8px}.srch .btn{padding:0 14px;display:grid;place-items:center}.srch svg{width:20px;height:20px}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:8px}
.lk{background:none;border:0;color:var(--pri);font:inherit;font-weight:700;cursor:pointer;padding:6px 0}
.calc{background:var(--card);border:1px dashed var(--mut);border-radius:16px;padding:14px;margin:16px 0}
.calc div{display:flex;justify-content:space-between;padding:3px 0}
.calc .tot{border-top:1px solid var(--line);margin-top:6px;padding-top:8px;font-weight:800;font-size:16px}
.tx{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.tx:last-child{border:0}.tx span{color:var(--mut);font-size:12.5px;display:block}
.plus{color:var(--ok);font-weight:700}.minus{color:var(--bad);font-weight:700}
.pf{padding:2px 14px}
input[type=checkbox]{width:44px;height:24px;accent-color:var(--pri)}
nav{display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.tab{background:none;border:0;font:inherit;font-size:11px;font-weight:600;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px;cursor:pointer;border-radius:12px}
.tab svg{width:22px;height:22px}.tab.on{color:var(--pri);font-weight:800}
.fab{width:50px;height:50px;border-radius:50%;background:var(--acc);color:#1D2250;display:grid;place-items:center;box-shadow:0 6px 16px rgba(245,183,0,.45);transform:translateY(-14px)}
.tab.add{padding-top:0}.tab.add span{margin-top:-10px}
.bg{position:absolute;inset:0;background:rgba(10,12,40,.55);display:none;z-index:5}
.bg.show{display:flex}.bg.s{align-items:flex-end}.bg.p{align-items:center;justify-content:center;padding:24px}
.sheet{background:var(--card);width:100%;border-radius:24px 24px 0 0;padding:18px 18px 28px;max-height:88%;overflow-y:auto;animation:up .25s ease}
.pop{background:var(--card);width:100%;border-radius:24px;padding:22px;text-align:center;animation:up .25s ease}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.st{font-size:18px;font-weight:800;display:block;margin-bottom:4px}
.gem{width:64px;height:64px;border-radius:20px;background:var(--acc);color:#1D2250;display:grid;place-items:center;margin:0 auto 12px}
.gem svg{width:32px;height:32px}
.tl{margin:14px 0 4px;padding-left:4px}
.tl div{position:relative;padding:0 0 16px 24px;border-left:2px solid var(--line);margin-left:6px}
.tl div::before{content:"";position:absolute;left:-7px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--line)}
.tl div.d{border-color:var(--ok)}.tl div.d::before{background:var(--ok)}
.tl div.c::before{background:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 30%,transparent)}
.tl span{display:block;font-size:12.5px;color:var(--mut)}
.toast{position:absolute;left:16px;right:16px;bottom:90px;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;z-index:9;display:none;text-align:center;font-weight:600}
.pts{background:var(--pri);color:var(--pri-t);border-radius:22px;padding:18px;text-align:center}
.pts .big{font-size:40px}.pbar{height:8px;border-radius:8px;background:rgba(127,127,127,.3);margin:12px 0 6px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--acc)}
.gate{text-align:center;padding:48px 12px}
.gate .gem{background:var(--chip);color:var(--pri)}
.back{background:none;border:0;color:var(--ink);font:inherit;font-weight:700;display:flex;align-items:center;gap:4px;cursor:pointer;margin-bottom:10px;padding:0}
.back svg{width:20px;height:20px}
.posters{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:2px 16px 12px;scroll-padding-inline:16px}
.po{flex:0 0 84%;aspect-ratio:16/10;scroll-snap-align:start;border:0;border-radius:24px;padding:18px;color:#fff;text-align:left;font:inherit;position:relative;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-end;gap:4px}
.po small{font-weight:700;letter-spacing:1.5px;font-size:11px;opacity:.85}
.po b{font-size:22px;line-height:1.15;font-weight:800;max-width:75%}
.po em{font-style:normal;font-weight:700;font-size:13px;background:rgba(255,255,255,.22);align-self:flex-start;padding:6px 12px;border-radius:20px;margin-top:8px}
.po .wm{position:absolute;right:-16px;top:-12px;width:160px;height:160px;opacity:.18}
.po .wm svg{width:100%;height:100%;stroke-width:1.2}
.po::before{content:"";position:absolute;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.1);right:-60px;bottom:-70px}
.p1{background:linear-gradient(135deg,#2B3590,#5A3FD1)}
.p2{background:linear-gradient(135deg,#F5B700,#FF8A3D);color:#1D2250}.p2 em{background:rgba(29,34,80,.14)}
.p3{background:linear-gradient(135deg,#0F766E,#22A06B)}
.p4{background:linear-gradient(135deg,#7A1F5C,#C2335E)}
.bn{flex:0 0 92%;scroll-snap-align:start;border:0;border-radius:24px;padding:18px 0 18px 18px;color:#fff;text-align:left;font:inherit;position:relative;overflow:hidden;cursor:pointer;min-height:184px;display:block}
.bn .bt{max-width:56%;position:relative;z-index:1}
.bn b{display:block;font-size:20px;font-weight:800;line-height:1.15;margin-bottom:6px}
.bn p{font-size:13px;opacity:.92;margin:0 0 14px}
.bn .cta{display:inline-block;background:#fff;color:var(--c);padding:9px 16px;border-radius:12px;font-weight:700;font-size:13px}
.bn svg.il{position:absolute;right:-4px;bottom:0;width:50%;height:auto}
.bn::before{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.1);right:-70px;top:-60px}
.b1{--c:#2B3590;background:linear-gradient(135deg,#2B3590,#4C56D6)}
.b2{--c:#0F766E;background:linear-gradient(135deg,#0F766E,#22A06B)}
.b3{--c:#1D2250;color:#1D2250;background:linear-gradient(135deg,#F5B700,#FF9A4D)}
.hero{background:linear-gradient(135deg,#1D2250,#2B3590 60%,#5A3FD1);color:#fff;border-radius:26px;padding:22px 0 0 20px;position:relative;overflow:hidden;min-height:260px}
.hero::before{content:"";position:absolute;width:240px;height:240px;border-radius:50%;background:rgba(245,183,0,.18);right:-80px;top:-80px}
.hero small{letter-spacing:2px;font-weight:700;font-size:11px;color:#F5B700;position:relative}
.hero h1{font-size:28px;line-height:1.1;margin:8px 0;max-width:60%;position:relative}
.hero p{font-size:13.5px;opacity:.9;max-width:56%;margin:0 0 16px;position:relative}
.hero .il{position:absolute;right:-8px;bottom:0;width:48%;height:auto}
.hero .btn{margin-bottom:22px;position:relative;z-index:1}
.svc{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.svc div{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.svc i{width:40px;height:40px;border-radius:12px;background:var(--chip);color:var(--pri);display:grid;place-items:center;margin-bottom:8px}
.svc i svg{width:22px;height:22px}.svc b{display:block}.svc span{font-size:12.5px;color:var(--mut)}
.stp{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}.stp:last-child{border:0}
.stp i{flex:none;width:30px;height:30px;border-radius:50%;background:var(--acc);color:#1D2250;font:800 14px/30px Manrope,sans-serif;text-align:center;font-style:normal}
.stp i svg{width:16px;height:16px;margin-top:7px}
.stp span{display:block;font-size:12.5px;color:var(--mut)}
.zones{display:flex;flex-wrap:wrap;gap:8px}
.band{margin-top:20px;background:var(--acc);color:#1D2250;border-radius:22px;padding:20px;text-align:center}
.band b{font-size:19px;display:block;margin-bottom:12px}.band .btn{background:#1D2250;color:#fff}
.dn-w{position:relative;width:210px;max-width:72%;margin:6px auto 20px}
.dn-w svg{width:100%;display:block}
.dn-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.dn-c b{font-size:32px;font-weight:800;line-height:1}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:20px 12px}
.cn{display:flex;align-items:center;gap:8px;font-size:13.5px}
.cn i{width:14px;height:14px;border-radius:5px;flex:none}
.cv{display:flex;align-items:center;gap:8px;margin:5px 0 2px}
.cv b{font-size:24px;font-weight:800}
.cv em{font-style:normal;font-size:12px;background:var(--chip);color:var(--mut);padding:2px 8px;border-radius:8px}
.msg{position:absolute;right:16px;bottom:84px;width:56px;height:56px;border-radius:50%;border:0;background:var(--pri);color:var(--pri-t);display:none;place-items:center;box-shadow:0 8px 20px rgba(0,0,0,.3);cursor:pointer;z-index:4}
.msg svg{width:26px;height:26px}.msg:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
.thread{max-height:40vh;overflow-y:auto;margin:12px 0;display:flex;flex-direction:column;gap:8px}
.bub{align-self:flex-end;background:var(--pri);color:var(--pri-t);padding:9px 13px;border-radius:16px 16px 4px 16px;max-width:80%;word-break:break-word}
.ab{border-radius:26px;position:relative;overflow:hidden;margin-top:16px;color:#fff}
.ab h3{font-size:22px;line-height:1.15;font-weight:800;margin:6px 0 8px}
.ab p{font-size:13.5px;opacity:.92;margin:0}
.ab small{letter-spacing:2px;font-weight:700;font-size:11px;color:#F5B700}
.ab ul{list-style:none;padding:0;margin:12px 0 14px}
.ab li{padding:3px 0 3px 22px;position:relative;font-size:13.5px}
.ab li::before{content:"\2713";position:absolute;left:0;font-weight:800;color:#F5B700}


.mv{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;text-align:left}
.mv div{background:rgba(255,255,255,.12);border-radius:18px;padding:14px}
.mv b{display:block;margin-bottom:4px;color:#F5B700}.mv span{font-size:12.5px;opacity:.92}
.ab.a2{background:linear-gradient(135deg,#0F766E,#22A06B);padding:22px 0 0 20px;min-height:250px}
.ab.a2 .t{max-width:58%;position:relative;z-index:1;padding-bottom:22px}
.ab.a2 .btn{background:#fff;color:#0F766E}
.ab.a2 svg{position:absolute;right:-6px;bottom:0;width:46%;height:auto}
.ab.a3{background:linear-gradient(135deg,#F5B700,#FF9A4D);color:#1D2250;padding:22px 18px;text-align:center}
.ab.a3 small,.ab.a3 li::before{color:#1D2250}
.ab.a3 svg{width:min(280px,92%);height:auto;display:block;margin:8px auto 10px}
.ab.a3 ul{display:inline-block;text-align:left}
.ab.a1{background:#F3F5FC;color:#1D2250;text-align:left}
.hr{position:relative;min-height:300px;display:flex;align-items:center}
.ht{width:55%;padding:22px 0 22px 18px;position:relative;z-index:1}
.ab.a1 small{color:#F28A00}.ab.a1 p{opacity:.82}
.hi{position:absolute;right:0;bottom:0;height:100%;width:auto;max-width:none;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 40%);mask-image:linear-gradient(90deg,transparent 0,#000 40%)}
.ab.a1 .mv{padding:0 14px 16px;margin-top:0}
.ab.a1 .mv div{background:#fff;border:1px solid #E1E5F5;color:#1D2250}
.ab.a1 .mv b{color:#F28A00}
.pk{width:100%;height:auto;display:block;border-radius:18px;margin:10px 0 12px;box-shadow:0 10px 24px rgba(29,34,80,.25)}
.lh{padding:20px}
.lh h1{font-size:28px;line-height:1.1;margin:8px 0}
.lh h3{font-size:22px;line-height:1.15;font-weight:800;margin:6px 0 8px}
.lh p{margin:0}
.eyebrow{letter-spacing:2px;font-weight:700;font-size:11px;color:#F28A00}
.pic{width:100%;height:auto;display:block;border-radius:18px;margin-top:16px}
.empty{text-align:center;padding:16px}.empty .pic{margin:0}
.empty b{display:block;font-size:19px;margin:14px 0 4px}.empty p{margin:0 0 14px}
.ab.a1,.ab.a2,.ab.a3{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.ab small,.ab.a1 small,.ab.a3 small,.ab li::before,.ab.a3 li::before,.ab .mv b,.ab.a1 .mv b{color:#F28A00}
.ab .mv div,.ab.a1 .mv div{background:var(--bg);border:1px solid var(--line);color:var(--ink)}
.ab.a2 .btn,.ab.a3 .btn{background:var(--pri)!important;color:var(--pri-t)!important}
.band{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.band .btn{background:var(--pri);color:var(--pri-t)}
.posters{gap:14px}
.bn{flex:0 0 88%;border-radius:28px;padding:20px 0 20px 20px;min-height:216px;box-shadow:0 16px 28px -14px rgba(29,34,80,.5),inset 0 0 0 1px rgba(255,255,255,.18);background:radial-gradient(circle at 100% 0,rgba(255,255,255,.26),transparent 48%),radial-gradient(rgba(255,255,255,.16) 1.2px,transparent 1.6px) 0 0/14px 14px,linear-gradient(135deg,var(--g1),var(--g2))}

/* auth */
function authV(){
 const x=S.view;
 const back=`<button class="back" onclick="view(null)">${ic('back')}Profile</button>`;
 if(x==='register')return `${back}<h1>Create merchant account</h1>${fld('mn','Merchant name',{p:'Your full name'})}${fld('sn','Shop name',{p:'Your shop or page name'})}${fld('ph','Mobile number',{p:'01XXXXXXXXX',m:'tel'})}${fld('pw','Password',{t:'password',p:'At least 6 characters'})}<div id="err" class="err"></div><button class="btn full" onclick="doReg()">Create account</button><p style="text-align:center;margin-top:10px" class="mut">Already registered? <button class="lk" onclick="view('login')">Sign in</button></p>`;
 if(x==='login')return `${back}<h1>Sign in</h1>${fld('ph','Mobile number',{p:'01XXXXXXXXX',m:'tel'})}${fld('pw','Password',{t:'password'})}<div id="err" class="err"></div><button class="btn full" onclick="doLogin()">Sign in</button><div style="display:flex;justify-content:space-between;margin-top:8px"><button class="lk" onclick="view('forgot')">Forgot password?</button><button class="lk" onclick="view('register')">Create account</button></div>`;
 return `${back}<h1>Reset password</h1><p class="mut">Enter your registered mobile number and the verification code.</p>${fld('ph','Mobile number',{p:'01XXXXXXXXX',m:'tel'})}${fld('cd','Verification code',{p:'Verification code',m:'numeric'})}${fld('pw','New password',{t:'password',p:'At least 6 characters'})}<div id="err" class="err"></div><button class="btn full" onclick="doReset()">Reset password</button>`;
}
const msha=async t=>{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')};
async function cloudM(ph){await dnet.init();if(dnet.db){const s=await dnet.db.collection('merchants').doc(ph).get();const x=s.exists?s.data():null;return x&&!x.deleted?x:null}const y=(dnet.L().merchants||{})[ph]||null;return y&&!y.deleted?y:null}
async function mkCredM(pw){const salt=Math.random().toString(36).slice(2);return{salt,hash:await msha(salt+pw)}}
const dbe=e=>(e&&(e.code||e.message))||'network';
let credDone={};
async function ensureCred(ph){
 const a=ACC[ph];if(!a||!a.pw||credDone[ph]||!S.logged||!S.user||S.user.ph!==ph)return;
 try{const d=await cloudM(ph);if(d&&d.hash){credDone[ph]=1;return}
  const c=await mkCredM(a.pw);await dnet.set('merchants',ph,Object.assign({id:ph,mn:a.mn,sn:a.sn,ph,shop:a.sn,name:a.mn,joined:a.joined||Date.now()},c));credDone[ph]=1}catch(e){}
}
async function doReg(){
 const mn=v('mn'),sn=v('sn'),ph=v('ph'),pw=$('#f_pw').value;
 if(!mn||!sn)return err('Enter your merchant name and shop name.');
 if(!okPhone(ph))return err('Enter an 11-digit mobile number starting with 01.');
 if(pw.length<6)return err('Password must be at least 6 characters.');
 if(ACC[ph])return err('This mobile number is already registered. Please sign in.');
 const k=x=>x.toLowerCase().replace(/\s+/g,' ');
 if(Object.values(ACC).some(a=>k(a.mn)===k(mn)&&k(a.sn)===k(sn)))return err('An account with this merchant name and shop name already exists.');
 let d=null;try{d=await cloudM(ph)}catch(e){return err('Could not check this number ('+dbe(e)+'). Check your internet and try again.')}
 if(d)return err('This mobile number is already registered. Please sign in.');
 const c=await mkCredM(pw),joined=Date.now();
 try{await dnet.set('merchants',ph,Object.assign({id:ph,mn,sn,ph,shop:sn,name:mn,joined,ts:joined,deleted:false,blocked:false,pickup:'',pay:'',fb:'',points:0},c));credDone[ph]=1}catch(e){toast('Account saved on this device only ('+dbe(e)+')')}
 ACC[ph]={mn,sn,ph,pw,joined,cs:1};S.user=ACC[ph];save();loadData(ph,1);sess(ph);S.logged=true;S.popSeen=false;S.tab='home';S.view=null;draw();
}
async function doLogin(){
 const ph=v('ph'),pw=$('#f_pw').value;let a=ACC[ph],d=null,ok=true;
 if(!okPhone(ph))return err('Enter an 11-digit mobile number starting with 01.');
 try{d=await cloudM(ph)}catch(e){ok=false}
 if(ok&&!d&&a&&a.cs){delete ACC[ph];save();a=null} /* account was deleted by admin */
 if(d&&d.hash){
  if(await msha((d.salt||'')+pw)!==d.hash)return err('Mobile number or password is incorrect.');
  a=Object.assign({},a||{},{mn:d.mn||d.name||(a&&a.mn)||'',sn:d.sn||d.shop||(a&&a.sn)||'',ph,pw,joined:d.joined||(a&&a.joined)||Date.now()});credDone[ph]=1;a.cs=1;
 }else{
  if(!a&&d){ /* old account saved before passwords were stored online: first sign-in on any device sets its password */
   if(pw.length<6)return err('This account has no online password yet. Enter a new password (at least 6 characters) to set it.');
   a={mn:d.mn||d.name||'',sn:d.sn||d.shop||'',ph,pw,joined:d.joined||Date.now()};toast('Password set for this account')}
  else{
  if(!a)return err(ok?'No account found for this number. Create an account first.':'Could not reach the server. Check your internet and try again.');
  if(a.pw!==pw)return err('Mobile number or password is incorrect.')}
 }
 ACC[ph]=a;save();S.user=a;loadData(ph);sess(ph);S.logged=true;S.popSeen=false;S.tab='home';S.view=null;draw();ensureCred(ph);
}
async function doReset(){
 const ph=v('ph'),pw=$('#f_pw').value;let a=ACC[ph],d=null;
 try{d=await cloudM(ph)}catch(e){}
 if(!a&&!d)return err('This number is not registered.');
 if(v('cd')!=='1234')return err('Verification code is incorrect.');
 if(pw.length<6)return err('Password must be at least 6 characters.');
 if(!a)a=ACC[ph]={mn:d.mn||d.name||'',sn:d.sn||d.shop||'',ph,pw,joined:d.joined};
 a.pw=pw;save();
 try{const c=await mkCredM(pw);await dnet.set('merchants',ph,c);credDone[ph]=1}catch(e){}
 toast('Password updated. Sign in with your new password.');view('login');
}

function range(n){const d=sales.slice(-n),p=sales.slice(-2*n,-n);const t=d.reduce((a,b)=>a+b,0),q=p.reduce((a,b)=>a+b,0);return{d,t,pc:q?Math.round((t-q)/q*100):null}}
function chart(anim){
 const n=S.range,{d}=range(n),W=340,H=176,L=8,RG=8,T=14,B=26,has=d.some(x=>x>0),base=H-B;
 const mx=has?Math.max(...d)*1.2:1,X=i=>L+i*(W-L-RG)/(n-1),Y=x=>base-x/mx*(base-T);
 const pt=d.map((x,i)=>[X(i),Y(x)]);
 let ln='M'+pt[0][0].toFixed(1)+' '+pt[0][1].toFixed(1);
 for(let i=0;i<n-1;i++){const a=pt[i-1]||pt[i],b=pt[i],c=pt[i+1],e=pt[i+2]||c,cl=y=>Math.min(base,Math.max(T,y));
  ln+=`C${(b[0]+(c[0]-a[0])/6).toFixed(1)} ${cl(b[1]+(c[1]-a[1])/6).toFixed(1)} ${(c[0]-(e[0]-b[0])/6).toFixed(1)} ${cl(c[1]-(e[1]-b[1])/6).toFixed(1)} ${c[0].toFixed(1)} ${c[1].toFixed(1)}`}
 const si=S.sel==null||S.sel>=n?n-1:S.sel;
 const dd=i=>{const x=new Date();x.setDate(x.getDate()-(n-1-i));return x};
 const lab=i=>n===7?dd(i).toLocaleDateString('en-GB',{weekday:'short'}):dd(i).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
 const xi=n===7?d.map((_,i)=>i):[1,8,15,22,29];
 const cp=v=>v>=1000?(v/1000).toFixed(v>=10000?0:1).replace('.0','')+'k':String(Math.round(v));
 const grid=[0,1,2,3].map(k=>{const y=base-k*(base-T)/3;return `<line x1="${L}" x2="${W-RG}" y1="${y}" y2="${y}" stroke="var(--line)" ${k?'stroke-dasharray="3 4"':''}/>${has&&k?`<text x="${L+2}" y="${y-3}" font-size="8.5" fill="var(--mut)">${cp(mx*k/3)}</text>`:''}`}).join('');
 const xl=xi.map((i,k)=>`<text x="${X(i)}" y="${H-8}" font-size="9.5" fill="var(--mut)" text-anchor="${i===0?'start':i===n-1?'end':'middle'}" ${i===si?'font-weight="700" style="fill:var(--ink)"':''}>${lab(i)}</text>`).join('');
 let tip='';
 if(has){const v=d[si],cx=X(si),cy=Y(v),t=v?tk(v):'No sales',w=t.length*6.4+16,tx=Math.min(W-w-2,Math.max(2,cx-w/2)),ty=Math.max(2,cy-32);
  tip=`<line x1="${cx}" x2="${cx}" y1="${ty+22}" y2="${base}" stroke="var(--pri)" stroke-dasharray="3 3" opacity=".5"/><circle cx="${cx}" cy="${cy}" r="9" fill="var(--pri)" opacity=".15"/><circle cx="${cx}" cy="${cy}" r="5" fill="var(--card)" stroke="var(--pri)" stroke-width="3"/><rect x="${tx}" y="${ty}" width="${w}" height="21" rx="8" fill="var(--ink)"/><text x="${tx+w/2}" y="${ty+14.5}" font-size="10.5" font-weight="700" text-anchor="middle" style="fill:var(--bg)">${t}</text>`}

function svcCard(c,fn,i,tag,t,p,cta,ill){return `<button class="bn ${c}" onclick="${fn}"><div class="bt"><span class="chipi">${ic(i,20)}</span><small>${tag}</small><b>${t}</b><p>${p}</p><span class="cta">${cta}<i>→</i></span></div>${ill}</button>`}
function about(d){
 return `<div class="ab a1"><div class="hr"><div class="ht"><small>ABOUT DRUTO</small><h3>Fast couriers.<br>Friendly faces.</h3><p>DRUTO helps online sellers and shops ship with confidence, from pickup at your door to handover at your customer’s.</p></div><img class="hi" src="${HERO}" alt="Smiling DRUTO merchant partner"></div>
 <div class="mv"><div><b>Our Mission</b><span>To make delivery simple, fast and affordable for every merchant, big or small.</span></div><div><b>Our Vision</b><span>To be the most trusted courier partner for merchants and customers everywhere.</span></div></div></div>
 ${d?`<div class="ab a2"><div class="t"><small>DELIVERY HEROES</small><h3>Meet the riders behind every parcel</h3><ul><li>Careful handling to the doorstep</li><li>Polite, on-time handover</li><li>Cash collected and recorded for you</li></ul><button class="btn" onclick="go('new')">Create Order</button></div>${ILL1}</div>`:''}
 <div class="ab a3"><small>PICKUP</small><h3>Pickup that comes to you</h3><img class="pk" src="${TRUCK}" alt="DRUTO pickup truck with a delivery man holding a parcel"><p>Skip the queue. Schedule a slot and a DRUTO rider collects your parcels right from your shop.</p><ul><li>Choose your time slot</li><li>Rider arrives at your shop</li><li>Tracked from the first scan</li></ul><br><button class="btn" onclick="openPickup()" style="background:#1D2250;color:#fff">Request Pickup</button></div>`;
}
function custs(){const m={};orders.forEach(o=>{const c=m[o.phone]=m[o.phone]||{name:o.name,phone:o.phone,addr:o.addr,n:0,cod:0,d:0};c.n++;c.cod+=o.cod;if(o.s==='del')c.d++});return Object.values(m)}
function openCust(i){const c=custs()[i];popup(`<div class="av" style="width:64px;height:64px;font-size:22px;margin:0 auto 10px">${ini(c.name)}</div><b class="st">${c.name}</b><p class="mut">${c.phone}<br>${c.addr}</p><div class="stats" style="margin:14px 0"><div class="stat"><b>${c.n}</b><span>Parcels</span></div><div class="stat"><b>${tk(c.cod)}</b><span>COD</span></div><div class="stat"><b>${Math.round(c.d/c.n*100)}%</b><span>Delivered</span></div></div><div class="two"><button class="btn line" onclick="closeAll()">Close</button><button class="btn" onclick="closeAll();go('new')">New parcel</button></div>`)}
function welcome(){popup(`<div class="gem">${ic('star')}</div><b class="st">Welcome, ${S.user.mn.split(' ')[0]}!</b><p class="mut" style="margin:6px 0 16px">Earn 10 points on every parcel, automatically. Redeem 500 points for ৳50 delivery credit.</p><button class="btn full" onclick="closeAll()">Got it</button>`)}

/* points, charges, pickup, notifications */
function openPoints(){
 const p=pts(),goal=500,pc=Math.min(100,p/goal*100);

/* ===== network layer: shared db, with same-browser fallback ===== */
const net={
 db:null,subs:[],
 L(){try{return JSON.parse(localStorage.getItem('druto_net')||'{}')}catch(e){return{}}},
 W(d){try{localStorage.setItem('druto_net',JSON.stringify(d))}catch(e){}},
 tick(){this.subs.forEach(f=>f())},
 setRider(x){if(this.db)return this.db.collection('riders').doc(x.phone).set(x);const d=this.L();d.riders=d.riders||{};d.riders[x.phone]=x;this.W(d);this.tick();return Promise.resolve()},
 watchRiders(cb){if(this.db)return this.db.collection('riders').onSnapshot(q=>cb(q.docs.map(d=>d.data())),()=>{});const f=()=>cb(Object.values(this.L().riders||{}));this.subs.push(f);f();return()=>{this.subs=this.subs.filter(y=>y!==f)}},
 sendNotice(n){if(this.db)return this.db.collection('notices').add(n);const d=this.L();d.notices=d.notices||{};d.notices['n'+Date.now()+Math.random().toString(36).slice(2,6)]=n;this.W(d);this.tick();return Promise.resolve()},
 watchNotices(ph,cb){if(this.db)return this.db.collection('notices').where('to','==',ph).onSnapshot(q=>cb(q.docs.map(d=>({id:d.id,...d.data()}))),()=>{});const f=()=>cb(Object.entries(this.L().notices||{}).filter(([k,v])=>v.to===ph).map(([k,v])=>({id:k,...v})));this.subs.push(f);f();return()=>{this.subs=this.subs.filter(y=>y!==f)}},
 sendApplication(a){if(this.db){if(JSON.stringify(a).length>240000)return Promise.reject(new Error('large'));return this.db.collection('rider_applications').doc(a.phone).set(a)}const d=this.L();d.apps=d.apps||{};d.apps[a.phone]=a;this.W(d);return Promise.resolve()},
 patchNotice(id,pt){if(this.db)return this.db.collection('notices').doc(id).update(pt);const d=this.L();if(d.notices&&d.notices[id]){Object.assign(d.notices[id],pt);this.W(d);this.tick()}return Promise.resolve()}
};
addEventListener('storage',e=>{if(e.key==='druto_net')net.tick()});
let RIDERS=[],NOTICES=[],NETREADY=false,seenIds=null;
async function startNet(){

  if(FIREBASE_CONFIG.projectId&&window.firebase){

function callRider(id){
 const o=orders.find(x=>x.id===id);
 if(o.riderPhone&&RIDERS.some(x=>x.phone===o.riderPhone))return notifyRider(id,o.riderPhone);
 const on=RIDERS.filter(x=>x.online);
 sheet(`<b class="st">Call a rider</b><p class="mut">Choose who to notify about ${o.id}.</p>${on.length?on.map(x=>`<div class="tx"><div>${esc(x.name)}<span>${x.phone} · ${esc(x.zone||'')}</span></div><button class="chip on" onclick="notifyRider('${id}','${x.phone}')">Call</button></div>`).join('')+`<br><button class="btn full" onclick="notifyRider('${id}','all')">Notify all available riders</button>`:'<p class="mut" style="padding:14px 0">No riders are online right now. Riders show up here after they sign in to the DRUTO Rider app and go online.</p>'}`);
}
function notifyRider(id,to){
 const o=orders.find(x=>x.id===id),t=to==='all'?RIDERS.filter(x=>x.online):RIDERS.filter(x=>x.phone===to);
 if(!t.length)return toast('No rider available right now');
 const shop=o.shop||S.user.sn;
 Promise.all(t.map(x=>net.sendNotice({to:x.phone,type:'call',parcel:o.id,shop,merchant:o.merchant||S.user.mn,mphone:o.mphone||S.user.ph,addr:S.pickup||'',cod:o.cod,customer:o.name,text:shop+' is calling you for parcel '+o.id,ts:Date.now(),read:false}))).then(()=>{
  if(to!=='all'){o.rider=t[0].name+' · '+t[0].phone;o.riderPhone=t[0].phone}
  closeAll();persist();draw();toast(to==='all'?t.length+' riders notified':'Rider notified');
 }).catch(()=>toast('Could not reach the rider network'));
}
function confirmPickup(){

 Promise.all(on.map(x=>net.sendNotice({to:x.phone,type:'pickup',shop:S.user.sn,merchant:S.user.mn,mphone:S.user.ph,addr:S.pickup,text:'Pickup request: '+n+' parcel'+(n>1?'s':'')+', '+slot,ts:Date.now(),read:false}))).then(()=>{closeAll();toast(on.length?'Pickup confirmed · '+on.length+' rider'+(on.length>1?'s':'')+' notified':'Pickup confirmed · no riders online yet')}).catch(()=>{closeAll();toast('Pickup confirmed, but riders could not be notified')});

 <p style="margin:12px 0 4px">${esc(n.text||'')}</p><div class="mut">${n.cod!=null?'COD '+tk(n.cod)+' · ':''}${esc(n.addr||'Pickup address not set')}</div>

 return `<div class="rtop">${rav(a,46,16)}<div style="flex:1;min-width:0"><div class="mut" style="font-size:12px">Welcome back</div><b style="font-size:18px">${esc(a.name)}</b></div><button class="rbell" onclick="rGo('tasks')" aria-label="Requests">${ic('bell')}${unread()?`<i>${unread()}</i>`:''}</button></div>
 <button class="pw ${R.on?'on':''}" onclick="rToggle(${!R.on})" aria-pressed="${R.on}"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">${I.power}</svg>${R.on?'ONLINE':'GO ONLINE'}</span></button>
 <p class="mut" style="text-align:center;margin:0 0 18px">${R.on?'Merchants can call you now. Keep this screen open to hear new requests.':'Tap the button to go online and receive merchant requests.'}</p>

 <button class="rbtn g" style="width:100%" onclick="location.hash=''">Open Merchant app</button><button class="rbtn g" style="width:100%;margin-top:10px" onclick="rOut()">Sign out</button>`;

function loadData(ph,fresh){
 let D=null;try{if(!fresh)D=JSON.parse(localStorage.getItem('druto_d_'+ph)||'null')}catch(e){}
 D=D||{};orders=D.o||[];sales=D.sa||new Array(60).fill(0);notifs=D.n||[];S.spent=D.sp||0;S.pickup=D.pk||'';S.pay=D.py||'';S.fb=D.fb||'';S.sms=D.sm!==false;S.push=D.pu!==false;MSGS=D.m||[];S.filter='all';S.range=7;S.sel=null;
}
if(S.logged)loadData(S.user.ph);
draw();
startNet();route();

<script>
/* ===== DRUTO Admin sync (merchant ↔ admin ↔ rider) — uses the same FIREBASE_CONFIG set at the top of this file ===== */
const dnet={db:null,subs:[],ready:null,
 L(){try{return JSON.parse(localStorage.getItem('druto_net')||'{}')}catch(e){return{}}},
 W(d){try{localStorage.setItem('druto_net',JSON.stringify(d))}catch(e){}},
 tick(){this.subs.forEach(f=>f())},
 init(){return this.ready||(this.ready=(async()=>{
  try{if(FIREBASE_CONFIG.projectId&&window.firebase){if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);this.db=firebase.firestore();return}}catch(e){console.warn(e)}
  try{this.db=window.claude?await window.claude.use('db'):null}catch(e){this.db=null}
 })())},
 set(c,id,x){if(this.db)return this.db.collection(c).doc(id).set(x,{merge:true});const d=this.L();(d[c]=d[c]||{})[id]=Object.assign((d[c]||{})[id]||{},x);this.W(d);this.tick();return Promise.resolve()},
 add(c,x){if(this.db)return this.db.collection(c).add(x);return this.set(c,'x'+Date.now()+Math.random().toString(36).slice(2,6),x)},
 watch(c,cb,f,val){
  if(this.db){const q=f?this.db.collection(c).where(f,'==',val):this.db.collection(c);return q.onSnapshot(s=>cb(s.docs.map(d=>({id:d.id,...d.data()}))),e=>{if(window.__dbErr)window.__dbErr(c,e)})}
  const fn=()=>cb(Object.entries(this.L()[c]||{}).map(([k,v])=>({id:k,...v})).filter(v=>!f||v[f]===val));this.subs.push(fn);fn();return()=>{this.subs=this.subs.filter(y=>y!==fn)}}
};
addEventListener('storage',e=>{if(e.key==='druto_net')dnet.tick()});
['set','add'].forEach(m=>{const f=dnet[m];dnet[m]=function(){const r=f.apply(this,arguments);return r&&r.then&&window.__trackNet?window.__trackNet(r):r}});
const dev=(key,text)=>dnet.add('events',{key,text,ts:Date.now(),by:'Merchant'}).catch(()=>{});
let EVS=[],BLOCKED=false,lastProf='',unW=[];

function profDoc(){const u=S.user;return{id:u.ph,mn:u.mn,sn:u.sn,ph:u.ph,pickup:S.pickup||'',pay:S.pay||'',fb:S.fb||'',sms:S.sms!==false,push:S.push!==false,joined:u.joined||(u.joined=Date.now(),save(),u.joined)}}
function syncProfile(force){
 if(!S.user||!S.logged)return;
 const p=profDoc(),j=JSON.stringify(p);if(!force&&j===lastProf)return;lastProf=j;
 dnet.init().then(()=>dnet.set('merchants',p.ph,Object.assign({},p,{ts:p.joined})).catch(()=>{}));
}
/* blocked ফিল্ড merge-এ মুছে না যাওয়ার জন্য — নতুন অ্যাকাউন্টে false বসাই */
function syncNew(){const p=profDoc();lastProf=JSON.stringify(p);dnet.init().then(()=>dnet.set('merchants',p.ph,Object.assign({},p,{ts:p.joined,blocked:false,deleted:false})).catch(()=>{}))}
function syncParcel(o){dnet.init().then(()=>dnet.set('parcels',o.id,{id:o.id,ts:o.ts,name:o.name,phone:o.phone,addr:o.addr,shop:o.shop,merchant:o.merchant,mphone:o.mphone,cod:o.cod,s:o.s,w:o.w,z:o.z,charge:chg(o).t,rider:o.rider||'Not assigned yet'}).catch(()=>{}))}

/* ---- wraps ---- */
const _persist=persist;
persist=function(){_persist();syncProfile(false)};
const _doReg=doReg;
doReg=async function(){const before=S.logged;await _doReg();if(!before&&S.logged){syncNew();startSync()}};
const _doLogin=doLogin;
doLogin=async function(){const before=S.logged;await _doLogin();if(!before&&S.logged){syncProfile(true);startSync()}};

submitP=function(){
 if(BLOCKED)return blockedMsg();
 const n=v('cn'),p=v('cp'),a=v('ca');
 if(!n||!a)return err('Enter the customer name and address.');
 if(!okPhone(p))return err('Enter an 11-digit mobile number starting with 01.');
 const id='PB-'+String(Date.now()).slice(-8),cod=+$('#cc').value||0;
 const o={id,ts:Date.now(),name:n,phone:p,addr:a,shop:S.user.sn,merchant:S.user.mn,mphone:S.user.ph,cod,s:'pend',time:'Just now',w:+$('#cw2').value||1,z:+$('#cz').value,rider:'Not assigned yet'};
 orders.unshift(o);sales[sales.length-1]+=cod;
 notifs.unshift({t:'+10 points added for '+id,d:'Just now',u:1});
 syncParcel(o);dev(id,'পার্সেল তৈরি হয়েছে — '+S.user.sn);
 S.filter='all';go('orders');toast('Parcel '+id+' created · +10 points');
};
confirmPickup=function(){
 if(BLOCKED)return blockedMsg();
 if(!S.pickup)return toast('Add your pickup address in Profile first');
 const slot=$('#pt').value,n=+$('#pn').value||1,ts=Date.now();
 const pend=orders.filter(o=>o.s==='pend').map(o=>o.id);
 dnet.init().then(()=>dnet.add('requests',{shop:S.user.sn,merchant:S.user.mn,mphone:S.user.ph,addr:S.pickup,text:'Pickup request: '+(pend.length||n)+' parcel'+((pend.length||n)>1?'s':'')+', '+slot,parcels:pend.length||n,slot,parcelIds:pend,status:'new',ts})).then(r=>Promise.all(pend.map(id=>dnet.set('parcels',id,{stage:'pickup_requested'}))).then(()=>r))
  .then(()=>{closeAll();toast('Pickup request sent to DRUTO · a rider will be assigned soon')})
  .catch(()=>{closeAll();toast('Could not reach DRUTO, try again')});
};
/* অ্যাডমিন রাইডার ঠিক করে দেয়, তাই মার্চেন্ট সরাসরি রাইডার কল করতে পারবে না */
callRider=function(){toast('DRUTO admin will assign a rider for you')};

const _parcelV=parcelV;
parcelV=function(id){
 let h=_parcelV(id);const o=orders.find(x=>x.id===id);if(!o)return h;
 const ev=EVS.filter(e=>e.key===id).sort((a,b)=>a.ts-b.ts);
 const rows=[];
 if(o.rider&&o.rider!=='Not assigned yet')rows.push(`<div class="tx"><div>Rider<span>${esc(o.rider)}</span></div></div>`);
 if(o.note)rows.push(`<div class="tx"><div>Rider comment<span>${esc(o.note)}</span></div></div>`);
 const log=ev.length?`<h2>Updates</h2><div class="card">${ev.map(e=>`<div class="tx"><div>${esc(e.text)}<span>${esc(e.by||'')} · ${new Date(e.ts).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</span></div></div>`).join('')}</div>`:'';
 const add=(rows.length?`<h2>Rider</h2><div class="card">${rows.join('')}</div>`:'')+log;
 return h.replace('<h2>Tracking</h2>',add+'<h2>Tracking</h2>');
};

/* ===== pick-up request (replaces "call rider"), wallet + withdraw, admin popups ===== */
let WD=[],POPS=[];
const reqd=o=>!!(o.pkReq||(o.stage&&o.stage!=='created'));
function sendPickup(ids,slot){
 if(BLOCKED)return blockedMsg();
 if(!S.pickup){closeAll();return toast('Add your pickup address in Profile first')}
 if(!ids.length){closeAll();return toast('No new parcels waiting for pick-up. Create a parcel first.')}
 const n=ids.length;
 dnet.init().then(()=>dnet.add('requests',{shop:S.user.sn,merchant:S.user.mn,mphone:S.user.ph,addr:S.pickup,text:'Pickup request: '+n+' parcel'+(n>1?'s':'')+(slot?', '+slot:''),parcels:n,slot:slot||'',parcelIds:ids,status:'new',ts:Date.now()}))
  .then(r=>Promise.all(ids.map(id=>dnet.set('parcels',id,{stage:'pickup_requested'}))).then(()=>r))
  .then(()=>{ids.forEach(id=>{const o=orders.find(x=>x.id===id);if(o){o.pkReq=true;o.stage='pickup_requested'}});persist();closeAll();draw();toast('Pick-up request sent to DRUTO')})
  .catch(e=>{closeAll();toast('Could not reach DRUTO, try again')});
}
confirmPickup=function(){const sl=$('#pt');sendPickup(orders.filter(o=>o.s==='pend'&&!reqd(o)).map(o=>o.id),sl?sl.value:'')};
callRider=function(id){const o=orders.find(x=>x.id===id);if(!o)return;if(reqd(o))return toast('Pick-up already requested for this parcel');sendPickup([id],'')};
const _pv2=parcelV;
parcelV=function(id){
 const h=_pv2(id),o=orders.find(x=>x.id===id);if(!o)return h;
 return h.replace(/<button class="btn" onclick="callRider\('([^']*)'\)">Call rider<\/button>/,(x,i)=>o.s!=='pend'?'':(reqd(o)?'<button class="btn" disabled>Pick-up requested</button>':`<button class="btn" onclick="callRider('${i}')">Pick-up</button>`));
};
const _openPickup=openPickup;
openPickup=function(){
 if(!S.logged)return signinPrompt();
 const n=orders.filter(o=>o.s==='pend'&&!reqd(o)).length;
 sheet(`<b class="st">Request pick-up</b><p class="mut">${S.pickup?'A rider will collect from '+esc(S.pickup)+'.':'Add your pickup address in Profile first.'}</p><div class="card" style="margin:10px 0"><div class="tx"><div>Parcels ready for pick-up</div><b>${n}</b></div></div><label for="pt">Time slot</label><select id="pt"><option>Today, 3–5 PM</option><option>Today, 6–8 PM</option><option>Tomorrow, 10 AM–12 PM</option></select><br><br><button class="btn full" onclick="confirmPickup()">Send pick-up request</button>`);
};
/* wallet */
walV=function(){
 const dl=orders.filter(o=>o.s==='del'),col=dl.reduce((a,o)=>a+(+o.cod||0),0),ch=dl.reduce((a,o)=>a+chg(o).t,0);
 const used=WD.filter(w=>w.status!=='rejected').reduce((a,w)=>a+(+w.amount||0),0),av=Math.max(0,col-ch-used);
 const tx=[];dl.forEach(o=>tx.push([o.id+' · Collect COD','COD '+tk(o.cod)+' − charge '+tk(chg(o).t),(+o.cod||0)-chg(o).t,o.ts||0]));
 WD.forEach(w=>tx.push(['Withdraw request · '+({pending:'Pending',paid:'Paid',rejected:'Rejected'}[w.status]||w.status),new Date(w.ts).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}),w.status==='rejected'?0:-w.amount,w.ts||0]));
 tx.sort((a,b)=>b[3]-a[3]);
 return `<h1>Wallet</h1><div class="pts"><div>Available balance</div><div class="big">${tk(av)}</div><small>${esc(S.pay||'No payout method added')}</small><br><br><button class="btn" onclick="openWithdraw()">Withdraw</button></div>
 <div class="agrid" style="margin-top:12px"><div class="card ast"><b>${tk(col)}</b><span>Collect COD</span></div><div class="card ast"><b>${tk(ch)}</b><span>Delivery charges</span></div></div>
 <h2>Transactions</h2><div class="card pf">${tx.length?'':'<p class="mut" style="padding:14px 0">No transactions yet.</p>'}${tx.map(([a,b,c])=>`<div class="tx"><div>${esc(a)}<span>${esc(b)}</span></div><b class="${c>0?'plus':'minus'}">${c>0?'+':c<0?'−':''}${tk(Math.abs(c))}</b></div>`).join('')}</div>`;
};
function walAvail(){const dl=orders.filter(o=>o.s==='del'),col=dl.reduce((a,o)=>a+(+o.cod||0),0),ch=dl.reduce((a,o)=>a+chg(o).t,0);return Math.max(0,col-ch-WD.filter(w=>w.status!=='rejected').reduce((a,w)=>a+(+w.amount||0),0))}
function openWithdraw(){
 if(!S.logged)return signinPrompt();
 const av=walAvail();
 if(av<=0)return toast('No balance to withdraw yet');
 sheet(`<b class="st">Withdraw request</b><p class="mut">Available ${tk(av)} · payout to ${esc(S.pay||'— add a payout method in Profile')}</p><label for="wa">Amount (৳)</label><input id="wa" type="number" inputmode="numeric" min="1" max="${av}" value="${av}"><div id="err" class="err"></div><br><button class="btn full" onclick="sendWithdraw()">Send withdraw request</button>`);

 const amt=Math.floor(+$('#wa').value||0),av=walAvail();

let _dbErrAt=0;window.__dbErr=(c,e)=>{const n=Date.now();if(n-_dbErrAt<8000)return;_dbErrAt=n;toast('Database error — '+c+': '+((e&&(e.code||e.message))||'blocked'))};

function chBadge(){const b=$('#msg');if(!b)return;let i=$('#msgb');if(i)i.remove();const n=S.logged?chUnread():0;if(n){i=document.createElement('i');i.id='msgb';i.textContent=n>9?'9+':n;b.appendChild(i)}}
const _drawM=draw;draw=function(){_drawM();chBadge()};
const hm=t=>new Date(t).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
const dd=t=>{const d=new Date(t),n=new Date();return d.toDateString()===n.toDateString()?'Today':d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})};
function chRender(){
 const l=$('#chl');if(!l)return;
 const near=l.scrollHeight-l.scrollTop-l.clientHeight<120;
 let last='';
 l.innerHTML=CH.length?CH.map(x=>{const d=dd(x.ts||Date.now()),h=d!==last?`<div class="ch-day">${d}</div>`:'';last=d;return h+`<div class="cb ${x.from==='admin'?'ad':'me'}">${esc(x.text)}<time>${hm(x.ts||Date.now())}</time></div>`}).join(''):'<div class="ch-empty"><b>Say hello!</b><br>Ask about parcels, pickups or payouts. The DRUTO team will reply here.</div>';
 if(near||!l.dataset.init){l.scrollTop=l.scrollHeight;l.dataset.init='1'}
}
function chFit(){const c=$('#chat');if(!c||!c.classList.contains('on'))return;const v=window.visualViewport;if(v){c.style.height=v.height+'px';c.style.transform='translateY('+v.offsetTop+'px)'}else c.style.height='100%';const l=$('#chl');if(l)l.scrollTop=l.scrollHeight}
if(window.visualViewport){visualViewport.addEventListener('resize',chFit);visualViewport.addEventListener('scroll',chFit)}
function openMsg(){
 if(!S.logged)return signinPrompt();
 const c=$('#chat');
 c.innerHTML=`<div class="ch-hd"><button class="bk" onclick="closeChat()" aria-label="Back">${ic('back')}</button><div class="ch-av">D</div><div><b>DRUTO Support</b><small>We reply here</small></div></div><div class="ch-list" id="chl"></div><div class="ch-in"><textarea id="mi" rows="1" placeholder="Type a message" aria-label="Message" onfocus="setTimeout(chFit,250)" oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,112)+'px'" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg()}"></textarea><button onclick="sendMsg()" aria-label="Send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg></button></div>`;
 c.classList.add('on');chFit();chRender();chMark();chBadge();
}
function closeChat(){const c=$('#chat');c.classList.remove('on');c.style.transform='';c.innerHTML='';chMark();chBadge()}
function sendMsg(){
 const i=$('#mi'),t=i.value.trim();if(!t)return;
 if(typeof BLOCKED!=='undefined'&&BLOCKED)return blockedMsg();
 i.value='';i.style.height='auto';i.focus();
 dnet.init().then(()=>dnet.add('chats',{mphone:S.user.ph,shop:S.user.sn,merchant:S.user.mn,from:'merchant',text:t,ts:Date.now()})).catch(e=>{toast('Message not sent — '+((e&&(e.code||e.message))||'try again'));i.value=t});
}
/* support FAQ */
const FAQ=[
['How do I create a parcel?','Open the New tab, enter the customer name, phone, address, weight, zone and COD amount, then tap Create. The parcel appears in Orders.'],
['How do I request a pickup?','Open the parcel and tap Pick-up, or use the Pickup button on Home. Save your pickup address in Profile first. DRUTO assigns a rider and you can follow the status in Orders.'],
['What are the delivery charges?','Inside Dhaka ৳60, Dhaka suburbs ৳90 and Nationwide ৳120 for up to 1 kg, plus ৳20 for every extra kg. There is no COD fee.'],
['When do I receive my COD money?','Once a parcel is delivered, its COD amount shows in your Wallet as Collect COD. Delivery charges are deducted and you can withdraw the remaining balance.'],
['How do I withdraw money?','Add your payout method in Profile, open Wallet, tap Withdraw, enter the amount and send the request. DRUTO reviews it and marks it as paid.'],
['How can I track a parcel?','Open Orders and tap the parcel to see its live status and tracking timeline.'],
['What if the customer rejects or returns the parcel?','The status changes to Rejected or Returned and is shown in Orders. COD is not added to your wallet for those parcels.'],
['How do I change my pickup address or payout method?','Go to Profile, update the details and save. New pickup requests use the updated address.'],
['How do points work?','You earn 10 points on every parcel. Redeem 500 points for ৳50 delivery credit from the Points button on Home.']
];
function fq(b){const q=b.parentElement,a=q.querySelector('.fa'),o=q.classList.toggle('on');b.setAttribute('aria-expanded',o);a.style.maxHeight=o?a.scrollHeight+'px':'0'}
function openSupport(){
 sheet(`<b class="st">Support</b><p class="mut" style="margin-bottom:12px">Quick answers to common questions.</p>${FAQ.map(([q,a])=>`<div class="fq"><button aria-expanded="false" onclick="fq(this)"><span>${esc(q)}</span><i>+</i></button><div class="fa"><p>${esc(a)}</p></div></div>`).join('')}<button class="btn full" style="margin-top:6px" onclick="closeAll();openMsg()">Message support</button>`);
}

/* ---- blocked ---- */
function blockedMsg(){toast('Your account is blocked. Contact DRUTO support.')}
function showBlock(on){
 let b=document.getElementById('blk');
 if(!on){if(b)b.remove();return}
 if(b)return;
 b=document.createElement('div');b.id='blk';
 b.style.cssText='position:fixed;inset:0;z-index:9999;background:#1D2250;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center;font-family:inherit';
 b.innerHTML='<div style="font-size:46px">🚫</div><h2 style="margin:12px 0 6px">Account blocked</h2><p style="opacity:.8;max-width:300px">Your merchant account has been blocked by DRUTO. Please contact support to get it reactivated.</p><button class="btn" style="margin-top:18px" onclick="persist();sess(0);S.logged=false;BLOCKED=false;showBlock(false);stopSync();go(\'me\')">Sign out</button>';
 document.body.appendChild(b);
}

/* ---- live watchers ---- */
function accGone(ph){
 stopSync();delete ACC[ph];save();try{localStorage.removeItem('druto_d_'+ph)}catch(e){}
 sess(0);S.logged=false;S.popSeen=false;BLOCKED=false;showBlock(false);go('me');toast('This account was removed by DRUTO. You can register again.');
}
function stopSync(){unW.forEach(f=>{try{f()}catch(e){}});unW=[]}
async function startSync(){
 stopSync();if(!S.logged)return;await dnet.init();const ph=S.user.ph;
 unW.push(dnet.watch('merchants',l=>{
  const m=l.find(x=>x.id===ph);
  if((m&&m.deleted)||(!m&&ACC[ph]&&ACC[ph].cs)){accGone(ph);return}
  if(!m)return;
  if(ACC[ph]&&!ACC[ph].cs){ACC[ph].cs=1;save()}
  const b=!!m.blocked;if(b!==BLOCKED){BLOCKED=b;showBlock(b)}
 }));
 unW.push(dnet.watch('parcels',l=>{
  let ch=false;
  l.forEach(p=>{const o=orders.find(x=>x.id===p.id);if(!o)return;
   if(p.stage&&o.stage!==p.stage){o.stage=p.stage;ch=true}
   const nr=p.rider||o.rider,ns=p.s||o.s,nn=p.note||'',np=p.riderPhone||o.riderPhone;
   if(o.s!==ns||o.rider!==nr||(o.note||'')!==nn||o.riderPhone!==np){o.s=ns;o.rider=nr;o.note=nn;o.riderPhone=np;o.time=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});ch=true}
  });
  if(ch){_persist();if(!document.activeElement||!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))draw()}
 },'mphone',ph));
 unW.push(dnet.watch('events',l=>{
  const ids=new Set(orders.map(o=>o.id));const n=l.filter(e=>ids.has(e.key));
  if(n.length!==EVS.length){EVS=n;if(S.view&&S.view.p&&!/INPUT|SELECT|TEXTAREA/.test((document.activeElement||{}).tagName||''))draw()}

 }));
 unW.push(dnet.watch('withdrawals',l=>{WD=l.sort((a,b)=>b.ts-a.ts);if(S.tab==='wallet'&&!S.view&&!document.querySelector('#sbg.show'))draw()},'mphone',ph));
 unW.push(dnet.watch('popups',l=>{POPS=l;showNextPopup()}));
 chFirst=true;
 unW.push(dnet.watch('chats',l=>{const was=chUnread();CH=l.sort((a,b)=>(a.ts||0)-(b.ts||0));
  const open=$('#chat').classList.contains('on');
  if(open){chRender();chMark()}else if(!chFirst&&chUnread()>was)toast('New message from DRUTO');
  chFirst=false;chBadge()},'mphone',ph));
}
if(S.logged){syncProfile(true);startSync();if(S.user)ensureCred(S.user.ph)}
</script>
